version: '3.8'

services:
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: aadhaar-api-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-aadhaar-masking-tasks}
      UPLOAD_DIR: /app/uploads
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SSL}
      KAFKA_CA_CERT_PATH: ${KAFKA_CA_CERT_PATH:-/app/certs/ca.pem}
      KAFKA_ACCESS_CERT_PATH: ${KAFKA_ACCESS_CERT_PATH:-/app/certs/service.cert}
      KAFKA_ACCESS_KEY_PATH: ${KAFKA_ACCESS_KEY_PATH:-/app/certs/service.key}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ./certs:/app/certs:ro

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: aadhaar-python-worker
    restart: always
    environment:
      MONGODB_URI: ${MONGODB_URI}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-aadhaar-masking-tasks}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-aadhaar-masking-group}
      UPLOAD_DIR: /app/uploads
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SSL}
      KAFKA_CA_CERT_PATH: ${KAFKA_CA_CERT_PATH:-/app/certs/ca.pem}
      KAFKA_ACCESS_CERT_PATH: ${KAFKA_ACCESS_CERT_PATH:-/app/certs/service.cert}
      KAFKA_ACCESS_KEY_PATH: ${KAFKA_ACCESS_KEY_PATH:-/app/certs/service.key}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ./certs:/app/certs:ro
