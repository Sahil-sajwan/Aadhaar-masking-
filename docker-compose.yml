version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aadhaar-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aadhaar_db
    volumes:
      - mongodb_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: aadhaar-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: aadhaar-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: aadhaar-api-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/aadhaar_db
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: aadhaar-masking-tasks
      UPLOAD_DIR: /app/uploads
    depends_on:
      - mongodb
      - kafka
    volumes:
      - ./uploads:/app/uploads

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: aadhaar-python-worker
    restart: always
    environment:
      MONGODB_URI: mongodb://mongodb:27017/aadhaar_db
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: aadhaar-masking-tasks
      KAFKA_GROUP_ID: aadhaar-masking-group
      UPLOAD_DIR: /app/uploads
    depends_on:
      - mongodb
      - kafka
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongodb_data:
