version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aadhaar-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aadhaar_db
    volumes:
      - mongodb_data:/data/db

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: aadhaar-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG4J_LOGGERS: 'org.apache.kafka.image.loader.MetadataLoader=WARN,org.apache.kafka.image.loader=WARN,org.apache.kafka.image=WARN,org.apache.kafka.metadata=WARN'
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'WARN'

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: aadhaar-api-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/aadhaar_db
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: aadhaar-masking-tasks
      UPLOAD_DIR: /app/uploads
    depends_on:
      - mongodb
      - kafka
    volumes:
      - ./uploads:/app/uploads

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: aadhaar-python-worker
    restart: always
    environment:
      MONGODB_URI: mongodb://mongodb:27017/aadhaar_db
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: aadhaar-masking-tasks
      KAFKA_GROUP_ID: aadhaar-masking-group
      UPLOAD_DIR: /app/uploads
    depends_on:
      - mongodb
      - kafka
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongodb_data:



